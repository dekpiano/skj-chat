version: "3.8"

services:
  app:
    image: skj2025-app
    container_name: skjchat_app
    restart: always
    ports:
      - "8071:443"
    volumes:
      - .:/var/www/html:cached
    environment:
      - CI_ENVIRONMENT=development
    networks:
      - skj2025_default

networks:
  skj2025_default:
    external: true
